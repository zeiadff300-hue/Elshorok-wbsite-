<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الشروق للمقاولات والنقل الثقيل | إدارة الحاج مرتضى حسني</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #162033;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --whatsapp: #16a34a;
      --border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding-bottom: 76px;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 800;
      font-size: 1.35rem;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-title { font-weight: 700; font-size: 1rem; }
    .brand-sub { font-size: 0.82rem; color: var(--muted); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.95rem;
    }

    .nav-links a:hover { color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover { background: var(--accent-dark); }

    .btn-wa {
      background: var(--whatsapp);
      color: #fff;
    }
    .btn-wa:hover { filter: brightness(1.08); }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Hero */
    .hero {
      padding: 64px 0 40px;
      border-bottom: 1px solid var(--border);
    }

    .kicker {
      display: inline-block;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--muted);
      max-width: 780px;
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .highlight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .highlight-card strong {
      display: block;
      color: var(--accent);
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .highlight-card span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* Sections */
    section { padding: 56px 0; }

    .section-head { margin-bottom: 28px; }
    .section-head .tag { color: var(--accent); font-weight: 700; font-size: 0.9rem; }
    .section-head h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 4px 0 8px; }
    .section-head p { color: var(--muted); max-width: 720px; }

    /* Direct Contact Card */
    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .phone-display {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 6px 0 12px;
    }

    /* Services Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }

    .service-num {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .service-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
    .service-card p { color: var(--muted); font-size: 0.95rem; }
